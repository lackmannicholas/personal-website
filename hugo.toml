baseURL = "https://nicklackman.com/"
locale = "en-US"
title = "Nick Lackman — Distributed Systems & AI"
enableRobotsTXT = false
disableKinds = ["taxonomy"]   # no /tags/ index page; each tag still gets /tags/<tag>/

[params]
  author = "Nick Lackman"
  description = "A personal engineering blog by Nick Lackman on distributed systems, AI, and the lessons of building them in production."
  email = "lackmannicholas@gmail.com"
  github = "lackmannicholas"
  linkedin = "https://www.linkedin.com/in/lackmannicholas"

[taxonomies]
  tag = "tags"

[permalinks.page]
  writing = "/writing/:contentbasename/"   # URL = file name; retitling never breaks links

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  term = ["HTML"]

[services.rss]
  limit = 50

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = true
  style = "github-dark"
  tabWidth = 4

[sitemap]
  changeFreq = "monthly"
