{{- /* Renders a list of writing pages. Context: a page collection. */ -}}
<ul class="writing-list">
  {{- range . }}
  <li><a href="{{ .RelPermalink }}">
    <div>
      <h3>{{ .Title | markdownify }}</h3>
      {{- with .Description }}<p>{{ . | markdownify }}</p>{{ end }}
    </div>
    <span class="writing-meta">{{ .Date.Format "Jan 2006" }}{{ with .Params.tags }} · {{ index . 0 }}{{ end }}</span>
  </a></li>
  {{- end }}
</ul>
